name: CI

# Strict verification: lockfile, tests, types, lint, production build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Start dev server for auth invariants
        run: |
          npm run dev -- --force > /tmp/kosez-dev.log 2>&1 &
          echo $! > /tmp/kosez-dev.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/__app-env > /tmp/kosez-env.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kosez-dev.log
          exit 1

      - name: Auth invariants
        run: npm run check:auth -- --dev-url http://127.0.0.1:8080

      - name: Install Chromium for browser smoke
        run: npx playwright install chromium

      - name: Browser smoke
        run: node scripts/browser-smoke.mjs http://127.0.0.1:8080/ "$GITHUB_WORKSPACE/.smoke/app.png"

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/kosez-dev.pid ]; then
            kill "$(cat /tmp/kosez-dev.pid)" || true
          fi

      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosez-browser-smoke
          path: .smoke
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
