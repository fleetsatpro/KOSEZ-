name: CI

# Strict verification: lockfile, tests, types, lint, production build

concurrency:
  group: kosez-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Start auth-on dev server
        env:
          KOSEZ_VITE_CACHE_DIR: /tmp/kosez-vite-auth-on
        run: |
          npm run dev -- > /tmp/kosez-dev.log 2>&1 &
          echo $! > /tmp/kosez-dev.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/__app-env > /tmp/kosez-env.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kosez-dev.log
          exit 1

      - name: Auth invariants
        run: npm run check:auth -- --dev-url http://127.0.0.1:8080

      - name: Stop auth-on dev server before learner smoke
        run: |
          if [ -f /tmp/kosez-dev.pid ]; then
            kill "$(cat /tmp/kosez-dev.pid)" || true
            rm -f /tmp/kosez-dev.pid
          fi

      - name: Build learner smoke preview
        env:
          VITE_AUTH_ENABLED: "false"
        run: |
          npm run build:dev > /tmp/kosez-smoke-build.log 2>&1
          tail -n 80 /tmp/kosez-smoke-build.log

      - name: Start auth-disabled learner smoke preview
        env:
          VITE_AUTH_ENABLED: "false"
        run: |
          npm run preview:restart
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8081/ > /tmp/kosez-smoke-home.html; then
              exit 0
            fi
            sleep 1
          done
          cat .grok/preview.log
          exit 1

      - name: Install Chromium for browser smoke
        run: npx playwright install chromium

      - name: Browser smoke
        env:
          BROWSER_SMOKE_EXPECT_AUTH: "disabled"
        run: node scripts/browser-smoke.mjs http://127.0.0.1:8081/ "$GITHUB_WORKSPACE/.smoke/app.png"

      - name: Stop dev servers
        if: always()
        run: |
          if [ -f /tmp/kosez-dev.pid ]; then
            kill "$(cat /tmp/kosez-dev.pid)" || true
          fi
          npm run preview:stop || true

      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosez-browser-smoke
          path: .smoke
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
